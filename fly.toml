# fly.toml — Deploy the Don't-Lie witness notary to Fly.io in 5 minutes.
#
# One-time setup:
#   1. brew install flyctl   (or curl -L https://fly.io/install.sh | sh)
#   2. fly auth signup
#
# Per-deploy:
#   fly launch --copy-config --name dontlie-witness   # uses this fly.toml
#   fly deploy
#   fly secrets set DONTLIE_WITNESS_KEY=...           # optional: import an existing key
#   fly status
#
# Cost: free tier covers ~3 small VMs. ~$1.94/mo for a 256MB VM after that.
# Latency: ~30ms globally via Fly's anycast.

app = "dontlie-witness"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9099"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 9099
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/"

[metrics]
  port = 9099
  path = "/metrics"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Persistent volume for the signing key. Survives redeploys.
[[mounts]]
  source = "witness_keys"
  destination = "/home/witness/.config/dontlie/witness"

# Health check on /pubkey so the load balancer knows the service is live.
[healthcheck]
  http_path = "/pubkey"
