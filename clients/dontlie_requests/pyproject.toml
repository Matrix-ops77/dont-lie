[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dontlie-requests"
version = "0.1.0"
description = "Drop-in for the requests library that points every chat-completions call at a Don't-Lie signed proxy."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Don't-Lie contributors" }]
dependencies = [
  "requests>=2.31",
  "dontlie>=0.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dontlie_requests*"]
