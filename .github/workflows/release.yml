name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

# A PyPI release is one of the few moments that can permanently
# damage user trust in the project (a bad published wheel gets
# cached in mirrors and lingers in `pip install` results for
# months). This workflow treats that with the gravity it deserves:
#
#   1. Test on the full Python matrix (3.10, 3.11, 3.12). ALL
#      three must pass. With fail-fast: false, a single flaky
#      version does not cancel the others — we see the real state.
#   2. Build wheel + sdist on the same Python that will publish.
#   3. Smoke-test the built wheel in a fresh venv — assert the
#      public CLI entry points and the package-data scripts are
#      actually in the artifact. This catches the class of bug
#      where a resource lives in the source tree but never makes
#      it into the wheel (e.g. `onboard/dontlie-passive`).
#   4. Generate a CycloneDX SBOM, SHA-256 manifest, and keyless SLSA
#      provenance for the exact release assets.
#   5. Only then upload to PyPI and create the GitHub release.
#
# If any of (1), (3), or the build fails, the workflow stops and
# nothing reaches PyPI.

jobs:
  test:
    name: test on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
      - name: Verify browser runtime
        run: |
          google-chrome --version
          chromedriver --version
      - name: Lint
        run: |
          ruff check dontlie test_*.py tools/reproducible_build.py
          mypy --strict dontlie/sign.py dontlie/protocols.py
          mypy --strict --follow-imports=skip dontlie/prove.py dontlie/demo/render_report.py
          mypy --strict dontlie/compliance.py tools/reproducible_build.py
      - name: Public-claims scan
        run: python tools/public_claims_scan.py
      - name: Test
        env:
          DONTLIE_REQUIRE_BROWSER_TEST: "1"
        run: python -m unittest discover -t . -v

  build:
    name: build wheel + sdist
    needs: test
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install build==1.5.0
      - name: Build
        run: python tools/reproducible_build.py dist
      - name: Wheel install smoke test
        # Same safety net as in ci.yml: the artifact users will
        # install must contain the artifact the test suite claims
        # to cover. This step is the last gate before publish.
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --quiet --upgrade pip
          /tmp/wheel-smoke/bin/pip install --quiet dist/dontlie-*-py3-none-any.whl
          /tmp/wheel-smoke/bin/dontlie --version
          /tmp/wheel-smoke/bin/dontlie version
          /tmp/wheel-smoke/bin/dontlie compliance hipaa-security --json
          /tmp/wheel-smoke/bin/dontlie compliance eu-ai-act --only-gaps
          test -x "$(/tmp/wheel-smoke/bin/python -c 'import onboard, os; print(os.path.join(os.path.dirname(onboard.__file__), "dontlie-passive"))')"
          /tmp/wheel-smoke/bin/dontlie-passive
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          python -m pip install cyclonedx-bom==7.3.0
          python -m venv /tmp/sbom-target
          /tmp/sbom-target/bin/pip install --quiet dist/dontlie-*-py3-none-any.whl
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          cyclonedx-py environment /tmp/sbom-target/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --spec-version 1.6 \
            --output-reproducible \
            --output-format JSON \
            --output-file "dist/dontlie-${version}.cdx.json"
      - name: Generate checksums and provenance subjects
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum dontlie-*.whl dontlie-*.tar.gz dontlie-*.cdx.json > SHA256SUMS
          )
          echo "hashes=$(cd dist && sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  reproducibility:
    name: reproducibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Reproduce a first-time wheel install
        env:
          PYTHON_BIN: python
          DONTLIE_REPRO_TRANSCRIPT: ${{ runner.temp }}/reproducibility.txt
        run: bash tools/reproducibility_check.sh dist/dontlie-*-py3-none-any.whl
      - name: Upload reproducibility transcript
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/reproducibility.txt

  provenance:
    needs: [build, reproducibility]
    permissions:
      actions: read
      id-token: write
      contents: write
    # The SLSA verifier currently requires this reusable generator to be
    # referenced by a full semantic-version tag rather than a commit SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      provenance-name: "dontlie-${{ github.ref_name }}.intoto.jsonl"
      upload-assets: true

  publish:
    needs: [test, build, reproducibility, provenance]
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing (PyPI OIDC) requires id-token: write on the
      # job — not the workflow — so the workflow-level `contents: write`
      # does not propagate. Without this, `pypa/gh-action-pypi-publish`
      # fails with "ACTIONS_ID_TOKEN_REQUEST_TOKEN environment variable
      # was unset".
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Stage package distributions
        run: |
          set -euo pipefail
          mkdir -p pypi-dist
          cp dist/dontlie-*.whl dist/dontlie-*.tar.gz pypi-dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Container actions can only see paths mounted from the workspace.
          # A host-runner path such as /tmp/pypi-dist is invisible inside the
          # publishing container.
          packages-dir: pypi-dist/

  github-release:
    needs: [test, build, reproducibility, provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
