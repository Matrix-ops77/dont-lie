name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

# A PyPI release is one of the few moments that can permanently
# damage user trust in the project (a bad published wheel gets
# cached in mirrors and lingers in `pip install` results for
# months). This workflow treats that with the gravity it deserves:
#
#   1. Test on the full Python matrix (3.10, 3.11, 3.12). ALL
#      three must pass. With fail-fast: false, a single flaky
#      version does not cancel the others — we see the real state.
#   2. Build wheel + sdist on the same Python that will publish.
#   3. Smoke-test the built wheel in a fresh venv — assert the
#      public CLI entry points and the package-data scripts are
#      actually in the artifact. This catches the class of bug
#      where a resource lives in the source tree but never makes
#      it into the wheel (e.g. `onboard/dontlie-passive`).
#   4. Only then upload to PyPI and create the GitHub release.
#
# If any of (1), (3), or the build fails, the workflow stops and
# nothing reaches PyPI.

jobs:
  test:
    name: test on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
      - name: Lint
        run: |
          ruff check dontlie test_*.py
          mypy --strict dontlie/sign.py dontlie/protocols.py
      - name: Test
        env:
          DONTLIE_REQUIRE_BROWSER_TEST: "1"
        run: python -m unittest discover -t . -v

  build:
    name: build wheel + sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install build
      - name: Build
        run: python -m build
      - name: Wheel install smoke test
        # Same safety net as in ci.yml: the artifact users will
        # install must contain the artifact the test suite claims
        # to cover. This step is the last gate before publish.
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --quiet --upgrade pip
          /tmp/wheel-smoke/bin/pip install --quiet dist/dontlie-*-py3-none-any.whl
          /tmp/wheel-smoke/bin/dontlie --version
          /tmp/wheel-smoke/bin/dontlie version
          test -x "$(/tmp/wheel-smoke/bin/python -c 'import onboard, os; print(os.path.join(os.path.dirname(onboard.__file__), "dontlie-passive"))')"
          /tmp/wheel-smoke/bin/dontlie-passive
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  reproducibility:
    name: reproducibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Reproduce a first-time wheel install
        env:
          PYTHON_BIN: python
          DONTLIE_REPRO_TRANSCRIPT: ${{ runner.temp }}/reproducibility.txt
        run: bash tools/reproducibility_check.sh dist/dontlie-*-py3-none-any.whl
      - name: Upload reproducibility transcript
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/reproducibility.txt

  publish:
    needs: [test, build, reproducibility]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing (PyPI OIDC) requires id-token: write on the
      # job — not the workflow — so the workflow-level `contents: write`
      # does not propagate. Without this, `pypa/gh-action-pypi-publish`
      # fails with "ACTIONS_ID_TOKEN_REQUEST_TOKEN environment variable
      # was unset".
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [test, build, reproducibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
