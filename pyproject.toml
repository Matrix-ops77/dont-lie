[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dontlie"
version = "0.3.6"
description = "Local-first, verifiable signed receipts for OpenAI-compatible AI calls."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Don't-Lie contributors" }]
dependencies = [
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "mypy>=1.10",
  "ruff>=0.6",
  "httpx>=0.27",
  "cryptography>=42",
  "pytest>=8",
]
test = [
  "httpx>=0.27",
  "cryptography>=42",
  "argon2-cffi>=23",
  "pytest>=8",
  "selenium>=4.25",
]


[project.scripts]
dontlie = "dontlie.cli:main"
dontlie-passive = "onboard.cli:main"

[project.urls]
Homepage = "https://github.com/Matrix-ops77/dont-lie"
Repository = "https://github.com/Matrix-ops77/dont-lie"
Issues = "https://github.com/Matrix-ops77/dont-lie/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dontlie*", "onboard*"]

[tool.setuptools.package-data]
# Ship the demo shell script inside the wheel so `dontlie demo` works
# after `pip install dontlie`, not just from a source checkout. The
# Python helpers (mock_provider, issue_request, render_report,
# tamper_walkthrough, cleanup, benchmark) are normal sub-modules and
# don't need a package-data directive — they ship automatically.
"dontlie.demo" = ["*.sh"]
# The `dontlie-passive` shim is the user-facing entry point for the
# `onboard` package's passive instrumentation. It MUST be in the
# wheel — without it, `pip install dontlie` followed by running
# `dontlie-passive` fails with "command not found" because the
# package ships only `onboard/cli.py` (a module) and not the
# `onboard/dontlie-passive` script that imports from it. The
# quoted key is required by setuptools for package-data targets.
"onboard" = ["dontlie-passive"]

[tool.ruff]
# Scope lint to the core product. Clients and demos have their own rules.
extend-exclude = [
    "clients",
    "demo",
    "witness-worker",
    "site",
    "build",
    "dist",
]

[tool.ruff.lint]
# We allow the following noisy patterns in the core product. They are
# documented exceptions to the rule, not laziness.
#
# - BLE001: bare `except Exception:` is fine for boundary code that
#   re-raises with context, or wraps third-party SDKs.
# - PLW1510: subprocess.run without explicit check= is fine when the
#   caller checks the returncode.
# - S110: try-except-pass is fine for fire-and-forget cleanup.
# - RUF012: mutable class defaults — we use them for caches by intent.
# - B017: assertRaises(Exception) — used in smoke tests to assert any
#   failure is raised, not a specific class.
# - DTZ011: date.today() is fine for wall-clock dates that don't need
#   timezone info (e.g. log rotation filenames).
extend-ignore = [
    "BLE001",
    "PLW1510",
    "S110",
    "RUF012",
    "B017",
    "DTZ011",
]

[tool.ruff.lint.per-file-ignores]
# Tests can be a bit looser.
"test_*.py" = ["E402", "E501"]
